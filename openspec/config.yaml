schema: spec-driven

context: |
  Two-person Selenium UI automation framework. The stack is declared in package.json and .nvmrc:
  read them rather than assuming versions.

  The application under test is Gitea, running on a DIFFERENT instance from the one that hosts this
  repository. Tests create and delete users, repositories and organizations. Never point a test,
  fixture or script at the instance that holds the code.

  Specs describe this automation framework, never Gitea's own behaviour. Behaviour of the
  application under test belongs in Cucumber .feature files.

  Spec domains mirror the framework layers: core-driver, core-api, page-objects, pipeline.

  A page object or fragment reaches the browser only through BaseComponent. Calling the driver from
  a page (driver.wait, driver.findElements) or driving a WebElement by hand is a review blocker: use
  the method that fits, and when none does, add one to BaseComponent or widen an existing one so
  every page gains it.

  A test reaches the browser only through a page object. A spec that calls page.locator, page.goto,
  driver.findElement, or asserts on a raw locator is a review blocker: use the page object that owns
  the page, and when it has no method for what the test asserts, add one there rather than reaching
  past it. This holds for non-functional suites too: a scanner is handed the page, the navigation and
  the assertions around it are not.

  The repository wiki is a separate git repository. Never edit wiki pages from here.

rules:
  proposal:
    - Under 400 words.
    - State what is out of scope, not only what is in it.
  specs:
    - A requirement describes the automation framework. If the sentence would still be true on a different framework, it belongs in a .feature file.
    - Describe only what this change adds, modifies or removes. Never backfill requirements for code the change does not touch.
  design:
    - Skip this artifact when the change touches a single layer and introduces no new pattern.
  tasks:
    - Each task should be completable as one Conventional Commit.

operations:
  apply:
    guidance:
      - Before finishing, run npm run format, npm run lint and npm run typecheck. These are the three checks the pipeline runs.
      - Commit messages carry no Co-Authored-By trailer and no agent attribution. The commits are the author's.
      - Comment only where the code cannot speak for itself. One or two plain sentences, never a paragraph.
      - Do not comment what the next line already says, and do not narrate the change, the alternatives considered or the history. That belongs in the commit message or in design.md.
      - "Branch from main as <issue-number>-<short-task-name>. Never commit to main."
      - "Pull request title is '#<issue-number> <short description>', not a Conventional Commit."
      - |
        Pull request description follows the project wiki's template, and `Closes #N` is required
        because it is what closes the issue on merge:

        ## Summary
        What this PR resolves, in two or three lines.

        ## Changes
        - Added: ...
        - Changed: ...
        - Removed: ...

        ## Evidence
        Screenshot or pipeline link showing the tests passing, whenever the PR touches test coverage.

        Closes #N
      - One responsibility per pull request. A prerequisite large enough to stand on its own belongs in its own pull request.
