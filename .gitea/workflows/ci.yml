# The quality gate on every push: format, lint and types. It needs no browser and no Gitea.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out from this Gitea, not from github.com.
          github-server-url: https://git.estiberz.online

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck
