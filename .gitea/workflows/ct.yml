name: CT

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: all
        options:
          - all
          - gitea-selenium-vitest
          - gitea-selenium-cucumber

concurrency:
  group: ct
  cancel-in-progress: true

jobs:
  # The suites are the service workspaces that expose a `test` script.
  # playwright-native and playwright-bdd expose none, so they stay out until
  # they do.
  #
  # This job exists because a schedule carries no dispatch inputs: on the
  # nightly run `github.event.inputs.suite` arrives empty, and `strategy.matrix`
  # has no way to express that fallback. The list is computed here and read back
  # through `fromJSON`.
  select:
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - name: Work out which suites this run covers
        id: pick
        env:
          CHOICE: ${{ github.event.inputs.suite }}
        run: |
          if [ -z "$CHOICE" ] || [ "$CHOICE" = "all" ]; then
            echo 'suites=["gitea-selenium-vitest","gitea-selenium-cucumber"]' >> "$GITHUB_OUTPUT"
          else
            echo "suites=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
          fi
          echo "this run covers: ${CHOICE:-all}"

  regression:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      # A failing suite must not cancel the other. The Cucumber suite is still
      # under construction, and losing the vitest results to it would make the
      # nightly run useless on exactly the days it matters.
      fail-fast: false
      # One suite at a time. Each job starts a job container plus its own
      # gitea-test and browser, on a VPS that also hosts the Git server this run
      # was triggered from. Raise it once the host has been measured.
      max-parallel: 1
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}

    services:
      gitea-test:
        image: docker.gitea.com/gitea:1.27.3
        env:
          USER_UID: "1000"
          USER_GID: "1000"
          GITEA__server__ROOT_URL: http://gitea-test:3000/
          GITEA__server__HTTP_PORT: "3000"
          GITEA__server__START_SSH_SERVER: "false"
          GITEA__database__DB_TYPE: sqlite3
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__security__SECRET_KEY: gitea-test-not-a-secret
          GITEA__service__DISABLE_REGISTRATION: "false"
          GITEA__service__REGISTER_EMAIL_CONFIRM: "false"

      selenium:
        image: selenium/standalone-all-browsers:4.35.0
        options: --shm-size=2g
        env:
          SE_NODE_MAX_SESSIONS: "3"
          SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

      # Healenium's proxy sits between the suite and Selenium: it forwards every
      # command, and steps in only when a locator matches nothing, resolving it
      # against the node path recorded for it on an earlier run.
      #
      # The proxy and the browser are per job; the store they consult is not. It
      # lives on the gitea-lab VPS, deployed from automindai-infra, because a
      # store created per run holds no earlier run to compare against and can
      # therefore never heal.
      #
      # It is reached by public hostname rather than over a network, the same
      # path the Actions runner already takes to reach Gitea itself: a job's
      # network is created fresh for that job and nothing outside can enter it.
      # HEALENIUM_SERVER_URL and HEALENIUM_SERVICE are the external and internal
      # addresses of the same backend, and here there is no internal one.
      hlm-proxy:
        image: healenium/hlm-proxy:2.2.1
        env:
          SELENIUM_SERVER_URL: http://selenium:4444/wd/hub
          HEALENIUM_SERVER_URL: https://healenium.estiberz.online
          HEALENIUM_SERVICE: https://healenium.estiberz.online
          IMITATE_SERVICE: https://imitator.estiberz.online
          HEAL_ENABLED: "true"
          RECOVERY_TRIES: "1"
          SCORE_CAP: ".6"
          HLM_LOG_LEVEL: info

    env:
      MAX_WORKERS: "3"
      GITEA_BASE_URL: http://gitea-test:3000
      SELENIUM_REMOTE_URL: http://selenium:4444
      GITEA_OWNER_CHROME: chrome-owner
      GITEA_OWNER_CHROME_PASSWORD: Qa-bot-not-a-secret-1
      GITEA_OWNER_FIREFOX: firefox-owner
      GITEA_OWNER_FIREFOX_PASSWORD: Qa-bot-not-a-secret-1
      GITEA_OWNER_EDGE: edge-owner
      GITEA_OWNER_EDGE_PASSWORD: Qa-bot-not-a-secret-1
      GITEA_INV_CHROME: inv-chrome
      GITEA_INV_CHROME_PASSWORD: Qa-bot2-not-a-secret-1
      GITEA_INV_FIREFOX: inv-firefox
      GITEA_INV_FIREFOX_PASSWORD: Qa-bot2-not-a-secret-1
      GITEA_INV_EDGE: inv-edge
      GITEA_INV_EDGE_PASSWORD: Qa-bot2-not-a-secret-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Wait for the application under test
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$GITEA_BASE_URL/api/healthz" > /dev/null && exit 0
            sleep 2
          done
          echo "gitea-test never became healthy"
          exit 1

      - name: Wait for the browser
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$SELENIUM_REMOTE_URL/status" | grep -q '"ready": *true' && exit 0
            sleep 2
          done
          echo "the selenium grid never became ready"
          exit 1

      - name: Register the owner and invited accounts, and mint an API token per browser
        run: |
          register() {
            local jar="$1" user="$2" pass="$3"
            csrf=$(curl -fsS -c "$jar" "$GITEA_BASE_URL/user/sign_up" \
              | sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' | head -1)
            curl -fsS -b "$jar" -o /dev/null \
              -X POST "$GITEA_BASE_URL/user/sign_up" \
              --data-urlencode "_csrf=$csrf" \
              --data-urlencode "user_name=$user" \
              --data-urlencode "email=$user@example.com" \
              --data-urlencode "password=$pass" \
              --data-urlencode "retype=$pass"
            curl -fsS -u "$user:$pass" "$GITEA_BASE_URL/api/v1/user" > /dev/null
            echo "account $user is usable"
          }

          for b in CHROME FIREFOX EDGE; do
            owner_user="GITEA_OWNER_$b"; owner_pass="GITEA_OWNER_${b}_PASSWORD"
            inv_user="GITEA_INV_$b"; inv_pass="GITEA_INV_${b}_PASSWORD"

            register "/tmp/gitea-$b-owner.jar" "${!owner_user}" "${!owner_pass}"
            register "/tmp/gitea-$b-inv.jar" "${!inv_user}" "${!inv_pass}"

            token=$(curl -fsS -u "${!owner_user}:${!owner_pass}" \
              -H "Content-Type: application/json" \
              -X POST "$GITEA_BASE_URL/api/v1/users/${!owner_user}/tokens" \
              -d '{"name":"continuous-testing","scopes":["write:user","write:repository","write:issue","write:organization"]}' \
              | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).sha1')
            echo "::add-mask::$token"
            echo "GITEA_TOKEN_$b=$token" >> "$GITHUB_ENV"
            echo "token minted for ${!owner_user}"
          done

      - name: Run the suite
        run: npm test -w @gitea-automation/${{ matrix.suite }}

      - name: Generate the Allure report
        if: always()
        run: npm run report -w @gitea-automation/${{ matrix.suite }}

      # The artifact name has to carry the suite: two matrix jobs uploading
      # under one name collide, and the second one loses.
      #
      # junit.xml exists for the vitest suite only — Cucumber reports through
      # Allure alone — so that path is absent there and the upload warns rather
      # than fails, which is the intended behaviour until the Cucumber suite
      # grows a JUnit formatter of its own.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report-${{ matrix.suite }}
          path: |
            services/${{ matrix.suite }}/allure-report/
            services/${{ matrix.suite }}/reports/junit.xml
          retention-days: 14
